sonar.projectKey=r0135tE1_sqs
sonar.organization=wellensittich


sonar.c.file.suffixes=-
sonar.cpp.file.suffixes=-
sonar.objc.file.suffixes=-

sonar.exclusions=**/venv/**,**/node_modules/**,**/*.pdf,**/alembic/**,**/__pycache__/**,**/dist/**,**/build/**,**/structurizr/**,**/docs/**,**/.next/**

sonar.coverage.exclusions=**/tests/**,**/alembic/**,src/backend/main.py,src/frontend/app/main.ts

# Test code is intentionally explicit — inline setup makes each test
# self-contained and easier to read. Cross-test duplication is acceptable here.
sonar.cpd.exclusions=**/tests/**,**/*.test.ts,**/*.spec.ts,**/test_*.py

sonar.python.coverage.reportPaths=src/backend/coverage/unit/coverage.xml,src/backend/coverage/integration/coverage.xml
sonar.javascript.lcov.reportPaths=src/frontend/coverage/lcov.info
sonar.typescript.lcov.reportPaths=src/frontend/coverage/lcov.info

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=sqs
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8
